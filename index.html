<style>
:root{color-scheme:dark;--bg:#10121c;--gold:#f9cf75;--cream:#fff9ec;--red:#ff575d;--blue:#65baf7;--muted:#c1c6d3;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

/* Home */
#home{background:radial-gradient(ellipse 120% 55% at 50% -10%,#3b3b56 0%,#171925 65%,#0c0e15 100%)}

.home-header{position:relative;z-index:8;padding:calc(env(safe-area-inset-top) + 10px) 17px 0;max-width:600px;margin:auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;font-size:14px;line-height:1.1}.brand-icon{display:grid;place-items:center;width:39px;height:39px;border:1px solid #f5cb7460;border-radius:14px;background:linear-gradient(140deg,#fff0bc,#c38f44);color:#25190e;font-size:23px}.brand small{display:block;letter-spacing:2px;font-size:9px;font-weight:900;color:var(--gold);direction:ltr;text-align:right;margin-top:4px}.mini-btn{color:#f8e7cb;background:#ffffff17;border:1px solid #ffffff35;border-radius:30px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.game-title{text-align:center;padding:6px 0 1px}.game-title h1{font-size:clamp(29px,8.2vw,48px);line-height:1.02;margin:8px 0 3px;letter-spacing:-1.6px;color:var(--cream);text-shadow:0 4px 26px #0008}.game-title h1 span{color:var(--gold)}.game-title p{font-size:12px;color:#d0d0db;margin:0}.game-title .mini-caption{font-size:10px;letter-spacing:2.3px;color:#fad48f;font-weight:900}.start-button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:55px;margin:12px auto 5px;border:1px solid #ffd69b6f;border-radius:17px;background:linear-gradient(180deg,#ff7460,#c72d48);color:white;box-shadow:0 7px 30px #f3345366;font-weight:1000;font-size:23px;text-shadow:0 2px 2px #7f1921}.start-button:active{transform:scale(.985)}.start-button .arrow{font-size:16px}
.hero-label{font-size:12px;text-align:center;color:#d2cad0;font-weight:800;white-space:nowrap;margin:7px 0 2px}.hero-label b{color:var(--gold)}
.hero-duo{position:absolute;top:calc(env(safe-area-inset-top) + 211px);bottom:0;width:100%;left:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));direction:rtl;overflow:hidden}
.hero-card{position:relative;min-width:0;overflow:hidden;border:0;border-left:1px solid #f6d78d29;background:linear-gradient(160deg,#283e63 5%,#10243a 55%,#09121b 100%);color:var(--cream);padding:0;isolation:isolate}
.hero-card.koko{background:linear-gradient(160deg,#53272f 0%,#302032 54%,#100f1a 100%)}
.hero-card::before{content:"";position:absolute;inset:0;opacity:.34;pointer-events:none;background:radial-gradient(circle at 50% 18%,#ffe2a13a 0%,transparent 62%),repeating-linear-gradient(120deg,transparent 0 40px,#fff1c513 41px 43px,transparent 44px 80px)}
.hero-card::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,transparent 50%,#11131bc0 84%,#11131bf5)}
.hero-card.active{box-shadow:inset 0 0 0 4px #f9d37d,inset 0 0 45px #ffe29733}.hero-card .check{position:absolute;z-index:9;top:14px;right:12px;width:29px;height:29px;display:grid;place-items:center;color:#222;background:#ffd77d;border-radius:50%;font-weight:1000;opacity:0;transform:scale(.5);transition:.18s}.hero-card.active .check{opacity:1;transform:scale(1)}
.hero-card .character-svg{position:absolute;bottom:-14%;left:50%;transform:translateX(-50%);height:92%;width:155%;max-width:none;filter:drop-shadow(0 8px 23px #0007)}
.hero-card .hero-face{position:absolute;z-index:2;top:3%;left:50%;width:clamp(160px,100%,310px);height:43%;transform:translateX(-50%);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 9px 7px #0006)}
.hero-card.avi .hero-face{top:4%;height:40%;width:116%}.hero-card.koko .hero-face{top:2%;height:44%;width:108%}
.hero-card .hero-info{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 21px);left:0;right:0;text-align:center;z-index:8;pointer-events:none}.hero-card .hero-info strong{font-size:clamp(40px,12vw,61px);line-height:1;display:block;text-shadow:0 3px 16px #000}.hero-card .hero-info small{font-size:12px;color:#fff2d8;font-weight:850}.hero-card .hero-info em{font-size:10px;display:block;font-style:normal;margin-top:4px;color:#cad0dc}
.home-footer{position:absolute;z-index:7;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 5px);display:none}
/* main game canvas */
#game{background:#101321;touch-action:none}#trackCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.game-vignette{position:absolute;pointer-events:none;inset:0;background:linear-gradient(180deg,#04070e9a,transparent 25%,transparent 70%,#0a1117ae);z-index:1}
.game-hud{position:absolute;z-index:6;top:calc(env(safe-area-inset-top) + 9px);left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:9px;pointer-events:none}
.game-hud>*{pointer-events:auto}.hud-left,.hud-right{display:flex;align-items:center;gap:7px}.hud-pill{background:#101526c9;border:1px solid #fff4cc3d;box-shadow:0 4px 18px #0007;border-radius:15px;min-height:43px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px;min-width:77px;backdrop-filter:blur(12px)}.hud-pill b{font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}.hud-pill small{font-size:9px;color:#e8d2ad;font-weight:800}.hud-button{width:44px;height:44px;border-radius:15px;border:1px solid #ffecaf55;background:#1b1e2bcc;color:#fff2d7;font-size:21px;backdrop-filter:blur(10px)}.hud-face{height:45px;width:45px;object-fit:contain;border-radius:13px;background:#171c2ddc;padding:2px;border:1px solid #ffffff50}
.game-hint{position:absolute;top:calc(env(safe-area-inset-top) + 77px);left:11px;right:11px;z-index:7;text-align:center;padding:8px 12px;min-height:34px;font-size:13px;font-weight:850;color:#fff7de;border-radius:25px;border:1px solid #e4d3a457;background:#171b2bba;backdrop-filter:blur(10px);pointer-events:none;transition:opacity .3s}
.control-pad{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;display:flex;justify-content:space-between;gap:12px;pointer-events:none;direction:ltr}.control-pair{display:flex;gap:7px;pointer-events:auto}.control{width:clamp(54px,16vw,68px);height:clamp(55px,15vw,64px);border:1px solid #ffe9b976;border-radius:18px;background:linear-gradient(180deg,#30465abb,#121b2bde);backdrop-filter:blur(9px);color:#fff5dc;font-weight:1000;font-size:26px;box-shadow:0 5px 22px #0009;touch-action:none}.control:active{transform:scale(.91);background:#dc634b}.control small{font-size:9px;display:block;line-height:1.3;margin-top:-4px}
.run-banner{position:absolute;z-index:5;top:33%;left:0;right:0;text-align:center;pointer-events:none;color:#ffdf8c;font-weight:1000;font-size:32px;text-shadow:0 5px 30px #130a09,0 0 20px #c47229;opacity:0;transform:scale(.85);transition:.24s}.run-banner.show{opacity:1;transform:scale(1)}
/* overlays */
.overlay{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#070911d6;backdrop-filter:blur(12px);padding:20px;overflow-y:auto}.overlay.active{display:flex}.dialog{width:100%;max-width:430px;border:1px solid #e4c58373;border-radius:25px;padding:23px;background:radial-gradient(circle at top right,#42415e,#202331 45%,#131725 100%);box-shadow:0 20px 70px #000c;position:relative;text-align:center}.dialog h2{font-size:30px;margin:8px 0 8px}.dialog p{font-size:14px;color:#d6d6df;line-height:1.7;margin:8px auto 17px}.dialog .big{font-size:58px}.dialog .score{color:var(--gold);font-size:44px;font-weight:1000;line-height:1}.dialog .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:20px 0}.dialog .scores div{background:#ffffff10;border-radius:12px;padding:10px 4px}.dialog .scores b{font-size:21px;display:block;color:#fff}.dialog .scores small{font-size:10px;color:#d0c7d3}.action{display:block;width:100%;min-height:50px;margin:9px 0;border:1px solid #f8d19066;background:linear-gradient(180deg,#ff7760,#bd2b4b);color:white;border-radius:14px;font-weight:950;font-size:18px}.action.secondary{background:#ffffff15;border-color:#ffffff43;font-size:15px}.dialog .close{position:absolute;top:10px;left:10px;border:0;background:#ffffff25;color:#fff;border-radius:50%;width:35px;height:35px;font-size:23px}.form-field{display:block;text-align:right;font-size:13px;font-weight:850;margin:12px 0}.form-field input{display:block;width:100%;height:49px;padding:11px;border:1px solid #ffffff4d;background:#0b1220;border-radius:12px;color:#fff;outline:none;font-size:16px;margin-top:6px}.form-field input:focus{border-color:#f6d48e}.error{color:#ffaba9;min-height:18px;font-size:12px}.tabs{display:flex;gap:5px;background:#0d1220;border-radius:13px;padding:5px}.tab{flex:1;background:none;border:none;color:#aab5c6;border-radius:9px;min-height:39px;font-weight:850}.tab.selected{background:#f5cd7d;color:#24202c}.rowstat{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #ffffff2c;gap:10px;text-align:right}.rowstat small{color:#c5c9d3}.rowstat b{color:#ffe1a3}.note{font-size:11px!important;color:#b4bccd!important;line-height:1.55!important}.dialog .smallface{width:95px;height:120px;object-fit:contain;margin:0 auto -3px;filter:drop-shadow(0 8px 9px #0005)}
@media (max-width:360px){.game-title h1{font-size:28px}.hero-duo{top:calc(env(safe-area-inset-top) + 201px)}.home-header{padding-inline:9px}.hero-card .hero-face{width:120%}.control{width:49px;height:51px}.hero-card .hero-info strong{font-size:41px}}@media (max-height:710px){.hero-duo{top:calc(env(safe-area-inset-top) + 190px)}.game-title h1{font-size:28px;margin-top:2px}.start-button{min-height:48px;margin-top:8px}.hero-label{margin-top:4px}.game-hint{display:none}.hero-card .hero-face{height:42%}}@media (orientation:landscape){.home-header{max-width:570px}.hero-duo{top:calc(env(safe-area-inset-top) + 185px);max-width:900px;right:0;left:0;margin:auto}.hero-card .hero-face{height:52%}.control-pad{bottom:7px}.game-hint{display:none}}

let data={hero:'koko',best:{avi:0,koko:0},coins:0,accounts:[],active:null,played:0},state='home',hero='koko',current=null,animationId=0,lastFrame=0,worldTime=0,viewW=400,viewH=800,dpr=1,canvas=$('trackCanvas'),ctx=canvas.getContext('2d',{alpha:false});

function setScreen(name){state=name;for(const e of document.querySelectorAll('.screen'))e.classList.toggle('active',e.id===name);$('overlay').classList.remove('active');if(name==='home'){cancelAnimationFrame(animationId);updateHome();}if(name==='game'){$('activeFace').src=FACES[hero];resizeCanvas();requestAnimationFrame(()=>resizeCanvas());}}

function showScores(){let p=profile();let best=Math.max(data.best.avi||0,data.best.koko||0);overlay(`<button class="close" data-action="close">×</button><div class="big">🏆</div><h2>שיאי המספרה</h2><div class="rowstat"><span>💪 אבי</span><b>${Math.floor(data.best.avi||0)} מ׳</b></div><div class="rowstat"><span>🕴️ קוקו</span><b>${Math.floor(data.best.koko||0)} מ׳</b></div><div class="rowstat"><span>🥇 השיא שלכם במכשיר</span><b>${Math.floor(best)} מ׳</b></div><div class="rowstat"><span>🪙 מטבעות שנאספו</span><b>${data.coins||0}</b></div><div class="rowstat"><span>🎮 ריצות</span><b>${data.played||0}</b></div><p class="note">השיאים נשמרים במכשיר הזה בלבד. טבלה משותפת לכל לקוחות המספרה תצריך שרת או מסד נתונים.</p><button class="action" data-action="close">יאללה, לרוץ!</button>`);}
let audioOn=true,ac=null;
function sound(freq=460,dur=.07){if(!audioOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}catch(e){}}
function start(){closeOverlay();current={lane:1,laneFloat:1,jump:0,slide:0,meters:0,coins:0,elapsed:0,objects:[],spawnIn:.8,speed:.43,failed:false,combo:0,runAnim:0,stumble:0,hero,seed:Math.random()*1000};worldTime=0;lastFrame=0;$('metersText').textContent='0';$('coinsText').textContent='0 🪙';$('gameHint').textContent='↔️ זוזו בין נתיבים · ⬆️ קפצו מעל כיסא · ⬇️ התכופפו מתחת לשלט';$('gameHint').style.opacity=1;setScreen('game');sound(530,.12);animationId=requestAnimationFrame(loop);}
function pause(){if(state!=='game'||!current||current.failed)return;state='pause';cancelAnimationFrame(animationId);overlay(`<div class="big">⏸️</div><h2>עצירה קצרה?</h2><p>${hero==='avi'?'אבי':'קוקו'} נח רגע. המירוץ יחכה לכם.</p><button class="action" data-action="resume">ממשיכים לרוץ!</button><button class="action secondary" data-action="restart">ריצה חדשה</button><button class="action secondary" data-action="home">בחירת דמות</button>`);}
function resume(){if(state!=='pause')return;state='game';closeOverlay();lastFrame=0;animationId=requestAnimationFrame(loop);}
function gameOver(reason){if(!current||current.failed)return;current.failed=true;state='over';cancelAnimationFrame(animationId);sound(175,.3);data.played=(data.played||0)+1;data.coins=(data.coins||0)+current.coins;const s=Math.floor(current.meters),best=data.best[hero]||0,isRecord=s>best;if(isRecord)data.best[hero]=s;const p=profile();if(p){p.played=(p.played||0)+1;p.best=Math.max(p.best||0,s);}save();const face=FACES[hero];overlay(`<img class="smallface" src="${face}" alt="${hero==='avi'?'אבי':'קוקו'}"><div class="big">${isRecord?'🏆':'💈'}</div><h2>${isRecord?'שיא חדש!':'תפסו אותך!'}</h2><p>${reason==='chair'?'אופס, כיסא ספרים בדרך!':reason==='bar'?'היית צריך להתכופף מתחת לשלט!':'המספרה תפסה אותך. עוד סיבוב?'}</p><div class="score">${s.toLocaleString('he-IL')} מ׳</div><div class="scores"><div><b>🪙 ${current.coins}</b><small>מטבעות</small></div><div><b>${Math.floor(data.best[hero]||0)}</b><small>שיא אישי</small></div><div><b>${Math.floor(current.elapsed)}</b><small>שניות</small></div></div><button class="action" data-action="restart">⚡ עוד ריצה!</button><button class="action secondary" data-action="home">🔁 לבחור דמות אחרת</button>`);}
$('dialog').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='close'){closeOverlay();if(state==='pause')resume();return;}if(a==='register'||a==='login')showAccount(a);if(a==='logout'){data.active=null;save();updateHome();showAccount('register');}if(a==='resume')resume();if(a==='restart')start();if(a==='home')setScreen('home');if(a.startsWith('submit-')){let n=validPhone($('loginPhone')?.value);if(!n){$('loginError').textContent='נא להכניס מספר נייד ישראלי תקין';return;}const found=data.accounts.find(p=>p.phone===n);if(a==='submit-register'){const name=$('loginName')?.value.trim();if(!name||name.length<2){$('loginError').textContent='נא לכתוב שם בן שתי אותיות לפחות';return;}if(found){$('loginError').textContent='הטלפון כבר רשום. אפשר להיכנס במספר הטלפון.';return;}data.accounts.push({name,phone:n,played:0,best:0});data.active=n;}else{if(!found){$('loginError').textContent='המספר עדיין לא רשום. אפשר להירשם בכמה שניות.';return;}data.active=n;}save();updateHome();closeOverlay();}});
function input(action){if(state!=='game'||!current||current.failed)return;const c=current;if(action==='left'){c.lane=Math.max(0,c.lane-1);sound(310,.05);}if(action==='right'){c.lane=Math.min(2,c.lane+1);sound(350,.05);}if(action==='jump'&&c.jump<=0&&c.slide<=0){c.jump=.86;sound(520,.08);}if(action==='slide'&&c.jump<=0&&c.slide<=0){c.slide=.79;sound(265,.08);}}
document.querySelectorAll('[data-control]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();input(b.dataset.control);}));
let touchStart=null;canvas.addEventListener('pointerdown',e=>{if(state!=='game')return;touchStart={x:e.clientX,y:e.clientY,t:performance.now()};try{canvas.setPointerCapture(e.pointerId)}catch{} });
canvas.addEventListener('pointerup',e=>{if(!touchStart||state!=='game')return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))input(dx<0?'left':'right');else input(dy<0?'jump':'slide');});
canvas.addEventListener('pointercancel',()=>touchStart=null);
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();const actions={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'jump','w':'jump',' ':'jump','arrowdown':'slide','s':'slide'};if(actions[k]){e.preventDefault();input(actions[k]);}if(k==='escape'&&state==='game')pause();else if(k==='escape'&&state==='pause')resume();});
window.addEventListener('resize',resizeCanvas);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game')pause();});
function resizeCanvas(){if(!canvas)return;const r=canvas.getBoundingClientRect();viewW=r.width||innerWidth;viewH=r.height||innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(viewW*dpr));canvas.height=Math.max(1,Math.round(viewH*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);}
function rand(a,b){return a+Math.random()*(b-a)}
function spawn(){const c=current;let lane=Math.floor(Math.random()*3),types=['chair','bar','trolley'],type=types[Math.floor(Math.random()*types.length)];c.objects.push({kind:type,lane,z:.04,checked:false});if(Math.random()<.68){let coinLane=(lane+(Math.random()<.5?1:2))%3;for(let j=0;j<3;j++)c.objects.push({kind:'coin',lane:coinLane,z:-.16-j*.14,checked:false,phase:Math.random()*6.3});}if(Math.random()<.15)c.objects.push({kind:'coin',lane:(lane+1)%3,z:-.7,checked:false,phase:Math.random()*6.3});c.spawnIn=rand(1.03,1.55)/Math.max(1,c.speed/.48);}
function loop(now){if(state!=='game'||!current)return;if(!lastFrame)lastFrame=now;const dt=Math.min(.045,(now-lastFrame)/1000);lastFrame=now;update(dt);draw();if(state==='game')animationId=requestAnimationFrame(loop);}
function update(dt){const c=current;c.elapsed+=dt;worldTime+=dt;c.runAnim+=dt;c.meters+=dt*(13+c.elapsed*.43);c.speed=Math.min(.84,.43+c.elapsed*.005);c.laneFloat+=(c.lane-c.laneFloat)*Math.min(1,dt*13);c.jump=Math.max(0,c.jump-dt);c.slide=Math.max(0,c.slide-dt);c.spawnIn-=dt;if(c.spawnIn<=0)spawn();for(const o of c.objects){const prev=o.z;o.z+=c.speed*dt;if(!o.checked&&prev<.75&&o.z>=.75){o.checked=true;if(o.lane===c.lane){if(o.kind==='coin'){c.coins++;c.combo++;sound(800,.045);if(c.combo%10===0)flash('+10 ⚡');}else if((o.kind==='chair'&&c.jump>.11)||(o.kind==='bar'&&c.slide>.08)){sound(420,.06);}else{gameOver(o.kind);return;}}}}c.objects=c.objects.filter(o=>o.z<1.15);$('metersText').textContent=Math.floor(c.meters).toLocaleString('he-IL');$('coinsText').textContent=c.coins+' 🪙';if(c.elapsed>8)$('gameHint').style.opacity=0;}
let bannerTimeout=0;function flash(text){const e=$('runBanner');e.textContent=text;e.classList.add('show');clearTimeout(bannerTimeout);bannerTimeout=setTimeout(()=>e.classList.remove('show'),630);}
// Pseudo-3D rendering in a single fast canvas (no external packages).
function grad(x,y,r,colors){const g=ctx.createRadialGradient(x,y,0,x,y,r);for(const [stop,col] of colors)g.addColorStop(stop,col);return g;}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function roundRect(x,y,w,h,r,fill,stroke=null){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=1.5;ctx.strokeStyle=stroke;ctx.stroke();}}
function ground(z){const p=Math.max(0,Math.pow(z,1.5));return {y:viewH*.29+(viewH*.89)*p,half:viewW*(.11+.67*p)};}
function laneX(lane,z){let g=ground(z);return viewW/2+((lane-1)/1.5)*g.half;}
function scene(){let W=viewW,H=viewH,c=current,t=worldTime;const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#171c30');sky.addColorStop(.5,'#3f2536');sky.addColorStop(1,'#100f18');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// Wall panels, glowing mirrors, barber shop lamps
ctx.fillStyle=grad(W*.5,H*.23,W*.85,[[0,'#ffb36722'],[1,'#a9461300']]);ctx.fillRect(0,0,W,H*.8);
for(let side=-1;side<=1;side+=2){for(let i=0;i<9;i++){const z=1-(i+.2)/10, g=ground(z),x=W/2+side*(g.half+28+z*26),s=.18+z*.9;ctx.save();ctx.translate(x,g.y-60*s);ctx.scale(s,s);roundRect(-18,-120,36,140,7,'#152034','#967d5266');roundRect(-12,-113,24,92,6,'#b5e4f41c','#ffdca27d');ctx.fillStyle='#ffad65';ctx.fillRect(-3,-90,6,60);ctx.shadowBlur=18;ctx.shadowColor='#ffb86c';ctx.fillStyle='#ffe3a9';ctx.fillRect(-4,-95,8,8);ctx.restore();}}
let a=ground(0),b=ground(1.2);
poly([[W/2-a.half,a.y],[W/2+a.half,a.y],[W/2+b.half,b.y],[W/2-b.half,b.y]],'#26364a','#edbb75a0',2);
for(let side of [-1,1]){const x0=W/2+side*a.half,x1=W/2+side*b.half;line(x0,a.y,x1,b.y,side<0?'#cb7757':'#6bcbef',6);}
const stripes=14,scroll=(c.meters*.10)%1;for(let i=0;i<=stripes;i++){let z=(i+scroll)/stripes;if(z>1.16)continue;let g=ground(z),edge=g.half;line(W/2-edge,g.y,W/2+edge,g.y,'#ffdba318',1+z*2.5);}
for(let sep of [-.333,.333]){ctx.setLineDash([10,24]);const x0=W/2+a.half*sep,x1=W/2+b.half*sep;line(x0,a.y,x1,b.y,'#fff1c287',1.5);ctx.setLineDash([]);}
// glowing gate and vanishing point
ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#edae67';ctx.strokeStyle='#efc778';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.37,H*.29);ctx.lineTo(W*.37,H*.18);ctx.quadraticCurveTo(W*.5,H*.08,W*.63,H*.18);ctx.lineTo(W*.63,H*.29);ctx.stroke();ctx.restore();
ctx.font='bold '+Math.max(12,W*.043)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffda93';ctx.fillText('💈  BARBER ESCAPE  💈',W*.5,H*.14);
}
function shadow(x,y,rx){ctx.save();ctx.fillStyle='#04070883';ctx.beginPath();ctx.ellipse(x,y,rx,rx*.2,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function item(o){if(o.z<=0||o.z>1.12)return;const g=ground(o.z),x=laneX(o.lane,o.z),y=g.y,s=.28+o.z*1.25;ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(o.kind==='coin'){let wob=Math.sin(worldTime*6+(o.phase||0))*.8;ctx.translate(0,-51+wob*7);ctx.shadowBlur=18;ctx.shadowColor='#ffbe45';ctx.fillStyle='#efb939';ctx.beginPath();ctx.ellipse(0,0,17*Math.max(.25,Math.cos(worldTime*4+o.phase)),20,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle='#fff0a3';ctx.stroke();ctx.font='22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff8d8';ctx.fillText('✂',0,1);} else if(o.kind==='chair'){shadow(0,4,45);roundRect(-43,-68,86,67,9,'#c62845','#ff94a4');roundRect(-39,-82,78,46,12,'#f54c61','#ffcfab');roundRect(-53,-30,106,19,6,'#242d3c','#bdcee5');line(-22,-7,-22,18,'#a1c0d4',7);line(22,-7,22,18,'#a1c0d4',7);ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText('💈',0,-48);} else if(o.kind==='bar'){roundRect(-65,-105,130,19,5,'#e6bd67','#fff0bc');line(-61,-98,-61,7,'#dfdebf',8);line(61,-98,61,7,'#dfdebf',8);roundRect(-55,-108,110,37,9,'#dd3654','#fbe4bd');ctx.fillStyle='#fff9dc';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('להתכופף!',0,-84);} else {shadow(0,5,36);roundRect(-37,-82,74,82,10,'#234d67','#82ccdc');roundRect(-28,-116,56,36,8,'#e6cd9d','#ffe7a5');ctx.fillStyle='#eee4c5';ctx.font='27px system-ui';ctx.textAlign='center';ctx.fillText('🧴',0,-88);line(-27,2,-27,14,'#161c29',8);line(27,2,27,14,'#161c29',8);}ctx.restore();}
function runner(){const c=current,W=viewW,H=viewH,sz=Math.min(Math.max(94,W*.32),155),floor=H*.87;const px=laneX(c.laneFloat,.88),jump=c.jump>0?Math.sin((.86-c.jump)/.86*Math.PI)*Math.min(125,H*.16):0;const slide=c.slide>0;const bob=jump?0:Math.sin(worldTime*17)*2;let y=floor-jump+bob,sc=slide?.72:1;ctx.save();ctx.translate(px,y);ctx.scale(sc,sc);shadow(0,jump/2,sz*.42);let stride=slide?0:Math.sin(worldTime*16)*.5;
ctx.lineCap='round';ctx.lineJoin='round';let navy=hero==='koko';let suit=navy?'#1e376e':'#c98768',outline=navy?'#0e1c48':'#895d52';
ctx.strokeStyle=navy?'#1a2c58':'#36455c';ctx.lineWidth=sz*.19;
ctx.beginPath();ctx.moveTo(-sz*.13,-sz*.35);ctx.lineTo(-sz*.19+stride*18,sz*.10);ctx.stroke();ctx.beginPath();ctx.moveTo(sz*.13,-sz*.35);ctx.lineTo(sz*.19-stride*18,sz*.10);ctx.stroke();
ctx.strokeStyle='#101623';ctx.lineWidth=sz*.17;ctx.beginPath();ctx.moveTo(-sz*.20+stride*18,sz*.11);ctx.lineTo(-sz*.31+stride*14,sz*.14);ctx.stroke();ctx.beginPath();ctx.moveTo(sz*.20-stride*18,sz*.11);ctx.lineTo(sz*.31-stride*14,sz*.14);ctx.stroke();
ctx.fillStyle=suit;ctx.strokeStyle=outline;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-sz*.30,-sz*.90);ctx.quadraticCurveTo(0,-sz*1.12,sz*.30,-sz*.90);ctx.lineTo(sz*.22,-sz*.28);ctx.lineTo(-sz*.22,-sz*.28);ctx.closePath();ctx.fill();ctx.stroke();
if(navy){poly([[-sz*.12,-sz*.94],[0,-sz*.58],[sz*.12,-sz*.94]],'#fff9e9');poly([[0,-sz*.89],[sz*.05,-sz*.82],[sz*.035,-sz*.41],[0,-sz*.32],[-sz*.035,-sz*.42],[-sz*.05,-sz*.82]],'#d5234b');}
else {ctx.strokeStyle='#e6b08a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-sz*.22,-sz*.77);ctx.quadraticCurveTo(-sz*.10,-sz*.64,0,-sz*.75);ctx.quadraticCurveTo(sz*.14,-sz*.64,sz*.22,-sz*.77);ctx.stroke();}
ctx.strokeStyle=navy?'#213f7d':'#db9171';ctx.lineWidth=sz*.20;ctx.beginPath();ctx.moveTo(-sz*.28,-sz*.90);ctx.lineTo(-sz*.50-stride*10,-sz*.63+stride*14);ctx.stroke();ctx.beginPath();ctx.moveTo(sz*.28,-sz*.90);ctx.lineTo(sz*.49+stride*10,-sz*.60-stride*12);ctx.stroke();
ctx.fillStyle='#edaf8d';for(const d of [-1,1]){ctx.beginPath();ctx.arc(d*sz*.5,(-.62+(d===1?-stride:stride)*.14)*sz,sz*.095,0,Math.PI*2);ctx.fill();}
let face=faceImgs[hero],ratio=hero==='koko'?1.40:1.18,faceW=sz*.78,faceH=faceW*ratio;if(face.complete&&face.naturalWidth)ctx.drawImage(face,-faceW*.5,-sz*1.84,faceW,faceH);else{ctx.font=sz*.7+'px system-ui';ctx.textAlign='center';ctx.fillText('😎',0,-sz*1.12);}
ctx.restore();}
function draw(){let W=viewW,H=viewH;scene();const objs=current.objects.slice().sort((a,b)=>a.z-b.z);const inFront=objs.filter(o=>o.z<=.89),front=objs.filter(o=>o.z>.89);inFront.forEach(item);runner();front.forEach(item);}
updateHome();
})();
